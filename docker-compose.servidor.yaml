# Despliegue en el servidor: back + base + Redis. El back escucha sólo en la
# máquina y lo publica Tailscale Funnel. La base se abre únicamente hacia la
# tailnet (DB_BIND = IP de Tailscale del servidor) para trabajar desde la Mac.
services:
  api:
    build: .
    container_name: splg-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      PORT: 3000
      # Antivirus de los adjuntos del chat (servicio `clamav`, abajo).
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # Sentry: el entorno es siempre producción; la versión la fija
      # desplegar.sh (splg-server@<versión del tag>). El DSN va en el .env.
      SENTRY_ENVIRONMENT: develop
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # Sólo arrancado, no sano: clamd tarda minutos en cargar las firmas y la API no
      # tiene que esperarlo (los archivos quedan pendientes y el escaneo se reintenta).
      clamav:
        condition: service_started

  db:
    image: postgis/postgis:14-3.4
    container_name: splg-bd
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: splg-redis
    restart: unless-stopped

  # Antivirus de los adjuntos del chat (PDF y documentos). Sin puertos
  # publicados: sólo lo alcanza la API por la red interna del compose. Necesita
  # salida a internet para bajar las firmas (freshclam) y ~1,5 GB de RAM.
  clamav:
    image: clamav/clamav:stable
    container_name: splg-clamav
    restart: unless-stopped
    volumes:
      - ./clamav:/var/lib/clamav
    # clamd tarda unos minutos en cargar las firmas la primera vez: la API
    # arranca cuando responde (clamdcheck.sh viene en la imagen oficial).
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
