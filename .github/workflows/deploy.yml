name: Deploy API

# Despliega la API en el servidor de producción (Orix) cuando el Release automático de main
# termina bien, o a mano desde Actions > Deploy API > Run workflow.
#
# El runner entra a la tailnet con una clave efímera (tag:ci) y se conecta por SSH con una
# clave que en el servidor sólo puede correr ~/splg/desplegar.sh: le manda un git bundle con
# el commit y el script hace respaldo → imagen → migraciones → API nueva → health, y vuelve a
# la imagen anterior si el health no responde.
#
# Secretos: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID. Variables: ORIX_HOST, ORIX_KNOWN_HOSTS, API_PUBLICA.
on:
  workflow_run:
    workflows: ['Release automatico']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o commit a desplegar'
        default: main

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Sólo lo que ya está en main
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "«$REF» no está en main: a producción sólo va lo que ya se integró a main."; exit 1
          fi

      - name: Datos del commit
        id: c
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "corto=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Aviso de inicio
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 Deploy API iniciado · v${{ steps.c.outputs.version }} (${{ steps.c.outputs.corto }}) por ${{ github.actor }}"

      - name: Entrar a la tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ORIX_KNOWN_HOSTS: ${{ vars.ORIX_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$ORIX_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Desplegar en el servidor
        run: |
          git branch -f desplegar HEAD
          git bundle create /tmp/api.bundle refs/heads/desplegar
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "labs-wagners@${{ vars.ORIX_HOST }}" "desplegar ${{ steps.c.outputs.sha }}" < /tmp/api.bundle

      - name: Health público
        run: |
          for _ in $(seq 1 20); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "${{ vars.API_PUBLICA }}/api/health" || true)
            [ "$c" = 200 ] && exit 0
            sleep 6
          done
          echo "La API pública no respondió 200 (último: $c)"; exit 1

      - name: Aviso de resultado
        if: always()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          if [ "${{ job.status }}" = success ]; then t="✅ Deploy API ok · v${{ steps.c.outputs.version }} (${{ steps.c.outputs.corto }}) en producción"
          else t="🔴 Deploy API falló · v${{ steps.c.outputs.version }} (${{ steps.c.outputs.corto }}). Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$t" -d disable_web_page_preview=true
