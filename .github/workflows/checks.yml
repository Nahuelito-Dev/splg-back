name: 🛡️ Guardián del Código (PR Checks)

# Se activa SOLO cuando se abre un Pull Request hacia main
on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      # 1. Bajar el código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configurar Node.js (Usamos la 20 igual que en deploy)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Verificar compilación (Build)
      # Si esto falla, GitHub bloqueará el botón de "Merge"
      - name: Verificar Build (NestJS)
        run: npm run build

      # (Opcional) Aquí podrías agregar tests si los tuvieras:
      # - name: Correr Tests
      #   run: npm run test