# CodeRabbit. Docs: https://docs.coderabbit.ai/reference/configuration
# Esquema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: es-AR
tone_instructions: 'Directo y concreto, en castellano rioplatense. Marcá BLOQUEANTE lo que impide el merge. Leé AGENTS.md del repo.'
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # Sólo PR contra develop y main (el resto de las ramas no se revisa).
    base_branches:
      - develop
      - main
  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/*.lock'
    - '!**/package-lock.json'
    - '!**/*.g.dart'
    - '!**/*.freezed.dart'
  path_instructions:
    - path: '**'
      instructions: 'Proyecto: API de SPLG (NestJS 11 + TypeORM + Postgres/PostGIS + Redis). Convenciones: splg-docs/sistema/back/CONVENCIONES.md (puede no estar en el checkout: AGENTS.md las resume). Leé AGENTS.md. Reglas clave: Aislamiento por distribuidora (tenant, header X-Distributor): todo query, servicio o endpoint que lea o escriba datos de una distribuidora tiene que filtrar por distributorId. Un endpoint sin aislamiento es BLOQUEANTE (seguridad). Cálculos de plata (precio, promo, recargo, total, comisiones): sólo en el back, con decimales exactos (nunca float). Que el cliente mande un total que el back acepta sin recalcular es BLOQUEANTE. Migraciones: nunca synchronize; cada cambio de esquema lleva migración generada y revisada, y una entidad o columna nueva actualiza el mapa de auditoría (npm run auditoria:mapa) porque la auditoría la escriben los triggers de la base.'
    - path: 'src/**/*.ts'
      instructions: 'Tenant (distributorId) en cada lectura/escritura, DTOs validados, sin any, errores de dominio. Plata sólo en el back con decimales exactos. Fechas de negocio en hora argentina (src/common/utils/dias-argentina.ts), nunca dependientes del TZ del proceso.'
    - path: 'src/migrations/**'
      instructions: 'Migración generada (no a mano), reversible (down), sin DELETE/TRUNCATE de datos de negocio, con mapa de auditoría al día (npm run auditoria:mapa) y sin romper triggers TRG_auditoria. Verificar nombres de índices/FK y orden de ejecución.'
    - path: '**/*.spec.ts'
      instructions: 'Cada test nuevo tiene que fallar sin el cambio que cubre. Sin dependencias del TZ de la máquina (tienen que pasar con TZ=UTC y con TZ=America/Argentina/Buenos_Aires), sin mocks que oculten el comportamiento real, sin bajar umbrales de cobertura.'
    - path: 'test/**'
      instructions: 'Tests de integración con testcontainers: aislados, sin datos compartidos entre suites, sin depender de la hora local.'
    - path: '.github/**'
      instructions: 'Workflows con permisos mínimos, sin secretos en claro, concurrency y cache para cuidar los minutos de Actions.'
chat:
  auto_reply: true
