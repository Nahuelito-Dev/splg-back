# Qodo Merge (pr-agent). Config del repo: se lee desde la rama por defecto.
# Docs: https://github.com/qodo-ai/pr-agent/blob/main/docs/docs/usage-guide/configuration_options.md
#       https://github.com/qodo-ai/pr-agent/blob/main/docs/docs/usage-guide/automations_and_usage.md
#       https://github.com/qodo-ai/pr-agent/blob/main/pr_agent/settings/configuration.toml

[config]
response_language = "es-AR"
# Lee AGENTS.md (y CLAUDE.md) del repo como contexto de la revisión.
repo_context_files = ["AGENTS.md", "CLAUDE.md"]

[github_app]
handle_pr_actions = ["opened", "reopened", "ready_for_review"]
feedback_on_draft_pr = false
# Revisa también los commits nuevos de la rama del PR.
handle_push_trigger = true
push_commands = ["/review"]
pr_commands = ["/describe", "/review", "/improve"]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
require_score_review = false
extra_instructions = """\
Respondé en castellano rioplatense, directo y concreto. Leé AGENTS.md del repo.
API de SPLG (NestJS 11 + TypeORM + Postgres/PostGIS + Redis). Convenciones: splg-docs/sistema/back/CONVENCIONES.md (puede no estar en el checkout: AGENTS.md las resume).
Marcá como BLOQUEANTE lo que impide el merge. Reglas del repo:
- Aislamiento por distribuidora (tenant, header X-Distributor): todo query, servicio o endpoint que lea o escriba datos de una distribuidora tiene que filtrar por distributorId. Un endpoint sin aislamiento es BLOQUEANTE (seguridad).
- Cálculos de plata (precio, promo, recargo, total, comisiones): sólo en el back, con decimales exactos (nunca float). Que el cliente mande un total que el back acepta sin recalcular es BLOQUEANTE.
- Migraciones: nunca synchronize; cada cambio de esquema lleva migración generada y revisada, y una entidad o columna nueva actualiza el mapa de auditoría (npm run auditoria:mapa) porque la auditoría la escriben los triggers de la base.
- Baja siempre lógica: nada de DELETE sobre datos de negocio. Transiciones de pedido y envase por las máquinas de estado del dominio, no por update directo.
- Fechas de negocio en hora argentina sin depender del TZ del proceso: usar src/common/utils/dias-argentina.ts; desconfiar de new Date(y, m, d), setHours, getDate y toISOString().slice(0, 10) sobre días de negocio.
- Contrato: endpoints existentes conservan las claves del JSON; los nuevos van en camelCase; Swagger completo; un endpoint nuevo o con contrato cambiado va en /api/v2 (la v1 está congelada).
- DTOs validados (class-validator), TypeScript estricto sin any, errores de dominio y no 500.
- Concurrencia: locks, transacciones e idempotencia donde hay stock, cobros o asignaciones.
Un test nuevo que no fallaría sin el cambio es un hallazgo.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
extra_instructions = """\
Sugerencias en castellano rioplatense. Respetá AGENTS.md y las convenciones del repo; no propongas
cambios de estilo que el lint ya cubre ni refactors fuera del alcance del PR.
"""

[pr_description]
extra_instructions = """\
Descripción en castellano rioplatense. Commits y títulos en Conventional Commits.
"""
