version: '3'

services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    container_name: garrafitas_db
    volumes:
      - ./postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    container_name: garrafitas_redis
    # No hace falta volumen si no te importa perder la cache al reiniciar
    # Pero para desarrollo es más rápido así.